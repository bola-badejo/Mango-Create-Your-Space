<!DOCTYPE html>
<html>
<head>
  <base href="/" />

  <!-- Flutter required -->
  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />

  <!-- iOS PWA Essentials -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mango">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Prevent zoom issues and improve scrolling -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <script src="polyfill.js"></script>

  <!-- Splash screen fix for iOS + Scroll optimizations -->
  <style>
    /* Prevent overscroll and pull-to-refresh */
    html {
      position: fixed;
      height: 100%;
      overflow: hidden;
      width: 100%;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      overscroll-behavior-y: contain;
      overscroll-behavior-x: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      background-color: #FFFFFF;
    }
    
    /* Loading indicator */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.3s ease-out;
      pointer-events: none;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #FF6B00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Prevent text selection */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    /* Allow text selection in inputs */
    input, textarea {
      -webkit-user-select: auto;
      user-select: auto;
    }
    
    /* iOS safe area support */
    @supports (padding: max(0px)) {
      body {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>

  <title>Mango</title>
  <script defer src="flutter.js"></script>
</head>

<body>
  <!-- Loading indicator -->
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <script type="text/javascript">
    // Set Flutter renderer to HTML for better compatibility
    window.flutterWebRenderer = "html";
  </script>

  <script>
    // Polyfill for Intl.Segmenter if not available
    if (!Intl.Segmenter) {
      console.log('Intl.Segmenter not available, using polyfill');
      // Load polyfill or provide alternative
    }
    
    // Prevent pull-to-refresh on iOS and Android
    document.addEventListener('touchmove', function(e) {
      if (e.target === document.documentElement || e.target === document.body) {
        e.preventDefault();
      }
    }, { passive: false });
    
    // Handle back button navigation for PWA (prevent refresh)
    (function setupNavigation() {
      // Push initial state
      window.history.pushState({ page: 'app', initial: true }, '', window.location.href);
      
      // Handle back/forward navigation
      window.addEventListener('popstate', function(event) {
        // Prevent default browser back behavior
        event.preventDefault();
        
        // Let Flutter/GetX handle the navigation
        // The Flutter app will listen to this event
        window.dispatchEvent(new CustomEvent('flutter-popstate', { 
          detail: { state: event.state } 
        }));
        
        // Push state again to prevent actual navigation
        window.history.pushState({ page: 'app' }, '', window.location.href);
      });
      
      // Prevent default back button behavior
      window.addEventListener('beforeunload', function(e) {
        // Only prevent if we're in the app
        if (window.location.hash && window.location.hash !== '#/') {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    })();
    
    // Handle iOS standalone mode link clicks
    if (window.navigator.standalone) {
      document.addEventListener('click', function(e) {
        var target = e.target;
        while (target && target.tagName !== 'A') {
          target = target.parentNode;
        }
        if (target && target.tagName === 'A' && target.hostname !== window.location.hostname) {
          e.preventDefault();
          window.open(target.href, '_blank');
        }
      });
    }
  </script>

  <script>
    // Service Worker Registration with timeout handling
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // Unregister any existing problematic service workers first
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            if (registration.scope.includes('firebase-cloud-messaging') || 
                registration.active && registration.active.scriptURL.includes('firebase-messaging')) {
              registration.unregister();
              console.log('Unregistered old Firebase SW');
            }
          });
        });
        
        // Register Firebase service worker with timeout (non-blocking)
        const firebaseSWPromise = navigator.serviceWorker.register('/firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope'
        });
        
        // Set timeout for Firebase SW registration
        const timeoutPromise = new Promise((resolve, reject) => {
          setTimeout(() => reject(new Error('Firebase SW registration timeout')), 5000);
        });
        
        Promise.race([firebaseSWPromise, timeoutPromise])
          .then(reg => console.log('Firebase Service Worker registered:', reg.scope))
          .catch(err => console.warn('Firebase Service Worker non-critical error:', err));
        
        // Register Flutter service worker (critical)
        if ('flutter_service_worker.js' !== '/firebase-messaging-sw.js') {
          navigator.serviceWorker.register('/flutter_service_worker.js')
            .then(reg => console.log('Flutter Service Worker registered:', reg.scope))
            .catch(err => console.log('Flutter Service Worker registration failed:', err));
        }
      });
    }
  </script>

  <script>
    // Hide loading indicator when Flutter renders
    function hideLoadingIndicator() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 300);
      }
    }
    
    // Listen for Flutter first frame
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(hideLoadingIndicator, 100);
    });
    
    // Fallback: Hide loading after timeout
    setTimeout(hideLoadingIndicator, 10000);
    
    // Load Flutter app
    window.addEventListener('load', function () {
      _flutter.loader.loadEntrypoint({
        entrypointUrl: "main.dart.js",
        serviceWorker: {
          serviceWorkerVersion: "1"
        }
      }).then(function (engine) {
        return engine.initializeEngine();
      }).then(function (app) {
        // Run the app
        return app.runApp();
      }).catch(function(error) {
        console.error('Flutter initialization error:', error);
        hideLoadingIndicator();
        // Show error message
        const loading = document.getElementById('loading');
        if (loading) {
          loading.innerHTML = '<div style="text-align: center; padding: 20px;">' +
            '<h2>Unable to load app</h2>' +
            '<p>Please check your connection and try again.</p>' +
            '<button onclick="location.reload()" style="padding: 10px 20px; background: #FF6B00; color: white; border: none; border-radius: 5px;">Retry</button>' +
            '</div>';
          loading.style.pointerEvents = 'auto';
        }
      });
    });
  </script>
  <!-- Mango Reader on web: PDF rendering (required by syncfusion_flutter_pdfviewer). -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
  </script>
</body>
</html>
