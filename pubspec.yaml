name: mango
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.0.1+4

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.3
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  firebase_analytics: ^12.0.1
  flutter_swiper_view: ^1.1.8
  cloud_firestore: ^6.0.1
  provider: ^6.1.2
  simple_animations: ^5.0.2
  quiver: ^3.2.1
  firebase_messaging: ^16.0.1
  firebase_storage: ^13.0.1
  intl_phone_field: ^3.2.0
  intl: ^0.20.2
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  country_state_city_pro: ^0.0.6
  dropdown_search: ^6.0.2
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  flutter_staggered_grid_view: ^0.7.0
  liquid_swipe: ^3.1.0
  expansion_tile_card: ^3.0.0
  glass: ^2.0.0+1
  carousel_slider: ^5.0.0
  animate_do: ^4.2.0
  youtube_player_flutter: ^9.0.0
  firebase_database: ^12.0.1
  crypto: ^3.0.6
  # 5.x uses protobuf 6, which livekit_client needs (grpc is not imported by the app).
  grpc: ^5.2.0
  syncfusion_flutter_pdfviewer: ^31.2.10
  glassmorphism: ^3.0.0
  lottie: ^3.3.1
  flutter_spinkit: ^5.2.1
  file_picker: ^10.3.6
  background_patterns: ^0.0.9
  iconify_flutter_plus: ^1.0.4
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  share_plus: ^12.0.0
  flutter_local_notifications: ^19.4.2
  # flutter_local_notifications: ^17.2.3
  # ffmpeg_kit_flutter_new: ^4.0.0
  audioplayers: ^6.5.1
  flutter_redirectly: ^2.1.1
  flutter_native_splash: ^2.4.1
  flutter_dotenv: ^6.0.0
  logger: ^2.0.2
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  hive_flutter: ^1.1.0
  chewie: ^1.13.0
  hive: ^2.2.3
  audio_service: ^0.18.18
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  record: ^6.1.2
  # Mango video player (films, series, vines). Already resolved via chewie.
  video_player: ^2.10.0
  # Read aloud in Mango Reader.
  flutter_tts: ^4.2.0
  # Temporary files for voice notes (was only resolved indirectly).
  path_provider: ^2.1.5
  # Image edits, filters and compression in the Mango composer.
  image: ^4.2.0
  # Text extraction for read aloud (already resolved via the PDF viewer).
  syncfusion_flutter_pdf: ^31.2.10
  permission_handler: ^12.0.1
  wave: ^0.2.2
  flutter_webrtc: ^1.2.0
  # Live audio and video for Space events (tokens issued by spaceLiveToken).
  livekit_client: ^2.13.1
  socket_io_client: ^3.1.2
  timezone: ^0.10.1
  font_awesome_flutter: ^10.9.0
  syncfusion_flutter_charts: ^31.2.10
  async: ^2.11.0
  ffmpeg_kit_flutter:
  url_strategy:
  audio_session:

  flutter_secure_storage: ^8.0.0
  http_interceptor:
  record_web:
  universal_html:
  animated_text_kit: ^4.2.2
  connectivity_plus:

  audio_video_progress_bar: ^2.0.3
  spotify: ^0.13.7
  youtube_explode_dart: ^3.0.5
  palette_generator: ^0.3.3+7
  scrollable_positioned_list: ^0.3.8
  flutter_image:
  extended_image:
  printing: ^5.11.1
  http: ^1.1.0

flutter_native_splash:
  android: true
  ios: true
  web: true
  color: "#000000"
  color_dark: "#000000"
  image: "asset/images/mango.png"
  image_dark: "asset/images/mango.png"


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: any
  path_provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.4.0
  # Lint set activated in analysis_options.yaml (was mis-indented under
  # flutter_launcher_icons, so it was never installed).
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/images/mango.png"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

dependency_overrides:
  # Firebase core overrides


# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Mango design system typography (bundled, no runtime fetching).
  # Licence: asset/fonts/OFL-Poppins.txt (SIL Open Font License 1.1).
  fonts:
    - family: Poppins
      fonts:
        - asset: asset/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: asset/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: asset/fonts/Poppins-SemiBold.ttf
          weight: 600

  # To add assets to your application, add an assets section, like this:
  assets:
    - asset/images/
    - asset/svg/
    - asset/
    - .env
    # - assets/env/
    # - .env
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
